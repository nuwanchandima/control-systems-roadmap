<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Systems Mastery Roadmap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      /* Soft Dark Theme (Default) */
      --bg: #121826;
      --bg1: #182031;
      --bg2: #1E293B;
      --bg3: #273549;
      --border: #334155;
      --border2: #475569;
      --cyan: #38BDF8;
      --cyan2: #0EA5E9;
      --cyan-dim: rgba(56, 189, 248, 0.1);
      --cyan-glow: rgba(56, 189, 248, 0.2);
      --amber: #FBBF24;
      --green: #34D399;
      --pink: #F472B6;
      --purple: #A78BFA;
      --text: #F8FAFC;
      --text2: #94A3B8;
      --text3: #64748B;
      --mono: 'JetBrains Mono', monospace;
      --sans: 'Inter', system-ui, sans-serif;
      --radius: 6px;
      --radius2: 10px;
    }

    :root[data-theme="light"] {
      --bg: #F8FAFC;
      --bg1: #FFFFFF;
      --bg2: #F1F5F9;
      --bg3: #E2E8F0;
      --border: #E2E8F0;
      --border2: #CBD5E1;
      --cyan: #0284C7;
      --cyan2: #0369A1;
      --cyan-dim: rgba(2, 132, 199, 0.1);
      --cyan-glow: rgba(2, 132, 199, 0.15);
      --amber: #D97706;
      --green: #059669;
      --pink: #DB2777;
      --purple: #7C3AED;
      --text: #0F172A;
      --text2: #475569;
      --text3: #64748B;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      font-size: 14px;
    }

    /* ─── Layout ─────────────────────────────── */
    .shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 240px;
      flex-shrink: 0;
      background: var(--bg1);
      border-right: 1px solid var(--border);
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .main {
      flex: 1;
      min-width: 0;
      padding: 0;
    }

    /* ─── Sidebar ─────────────────────────────── */
    .sb-header {
      padding: 24px 20px 20px;
      border-bottom: 1px solid var(--border);
    }

    .sb-logo {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--cyan);
      letter-spacing: 0.12em;
      margin-bottom: 4px;
    }

    .sb-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    .sb-sub {
      font-size: 11px;
      color: var(--text2);
      margin-top: 2px;
    }

    .progress-wrap {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .progress-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .progress-label span {
      color: var(--cyan);
    }

    .progress-track {
      height: 3px;
      background: var(--bg3);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--cyan2), var(--cyan));
      border-radius: 99px;
      transition: width 0.4s ease;
      width: 0%;
    }

    .sb-nav {
      padding: 12px 0;
      flex: 1;
    }

    .sb-phase-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 9px 20px;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
      border-left: 2px solid transparent;
    }

    .sb-phase-btn:hover {
      background: var(--bg2);
    }

    .sb-phase-btn.active {
      background: var(--cyan-dim);
      border-left-color: var(--cyan);
    }

    .sb-phase-num {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      min-width: 20px;
      font-weight: 500;
    }

    .sb-phase-btn.active .sb-phase-num {
      color: var(--cyan);
    }

    .sb-phase-name {
      font-size: 12px;
      color: var(--text2);
      font-weight: 400;
      line-height: 1.3;
    }

    .sb-phase-btn.active .sb-phase-name {
      color: var(--text);
      font-weight: 500;
    }

    .sb-phase-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--border2);
      flex-shrink: 0;
      margin-left: auto;
      transition: background 0.15s;
    }

    .sb-phase-btn.active .sb-phase-dot {
      background: var(--cyan);
    }

    .sb-phase-btn.done .sb-phase-dot {
      background: var(--green);
    }

    .sb-phase-btn.done .sb-phase-num {
      color: var(--green);
    }

    .sb-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }

    .sb-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .sb-stat {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      text-align: center;
    }

    .sb-stat-n {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 500;
      color: var(--cyan);
      line-height: 1;
      margin-bottom: 3px;
    }

    .sb-stat-l {
      font-size: 10px;
      color: var(--text3);
    }

    /* ─── Main panel ─────────────────────────── */
    .main-header {
      background: var(--bg1);
      border-bottom: 1px solid var(--border);
      padding: 28px 40px 24px;
    }

    .phase-eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--cyan);
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .phase-heading {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .phase-meta-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 500;
      font-family: var(--mono);
    }

    .pill-duration {
      background: rgba(61, 214, 140, 0.1);
      color: var(--green);
      border: 1px solid rgba(61, 214, 140, 0.25);
    }

    .pill-prereq {
      background: rgba(155, 143, 255, 0.1);
      color: var(--purple);
      border: 1px solid rgba(155, 143, 255, 0.25);
    }

    .pill-hw {
      background: rgba(245, 166, 35, 0.1);
      color: var(--amber);
      border: 1px solid rgba(245, 166, 35, 0.25);
    }

    .pill-cost {
      background: rgba(0, 212, 255, 0.08);
      color: var(--cyan2);
      border: 1px solid rgba(0, 212, 255, 0.2);
    }

    .phase-desc {
      font-size: 13px;
      color: var(--text2);
      max-width: 680px;
      line-height: 1.65;
      margin-top: 10px;
    }

    /* ─── Content area ───────────────────────── */
    .content-area {
      padding: 32px 40px;
    }

    /* ─── Sections ───────────────────────────── */
    .section-block {
      margin-bottom: 40px;
    }

    .section-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 0.12em;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ─── Topics grid ────────────────────────── */
    .topics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 10px;
      margin-bottom: 8px;
    }

    .topic-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      padding: 16px;
      position: relative;
      border-top: 2px solid var(--border);
      transition: border-top-color 0.15s;
    }

    .topic-card:hover {
      border-top-color: var(--cyan2);
    }

    .topic-icon {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .topic-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
    }

    .topic-desc {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.5;
    }

    .topic-items {
      margin-top: 10px;
      list-style: none;
    }

    .topic-items li {
      font-size: 11px;
      color: var(--text2);
      padding: 2px 0 2px 12px;
      position: relative;
      line-height: 1.5;
    }

    .topic-items li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: var(--text3);
      font-size: 9px;
      top: 4px;
    }

    .topic-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 10px;
    }

    .tag {
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 99px;
      border: 1px solid;
    }

    .tag-math {
      color: var(--purple);
      border-color: rgba(155, 143, 255, 0.3);
      background: rgba(155, 143, 255, 0.07);
    }

    .tag-code {
      color: var(--cyan2);
      border-color: rgba(0, 212, 255, 0.2);
      background: rgba(0, 212, 255, 0.06);
    }

    .tag-hw {
      color: var(--amber);
      border-color: rgba(245, 166, 35, 0.3);
      background: rgba(245, 166, 35, 0.07);
    }

    .tag-tools {
      color: var(--green);
      border-color: rgba(61, 214, 140, 0.3);
      background: rgba(61, 214, 140, 0.07);
    }

    /* ─── Project cards ──────────────────────── */
    .project-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      overflow: hidden;
      margin-bottom: 10px;
    }

    .project-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 18px 20px;
      cursor: pointer;
      user-select: none;
      transition: background 0.15s;
    }

    .project-header:hover {
      background: var(--bg3);
    }

    .proj-num {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      color: var(--cyan2);
      background: var(--cyan-dim);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: var(--radius);
      padding: 3px 8px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .proj-head-info {
      flex: 1;
      min-width: 0;
    }

    .proj-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .proj-tagline {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.4;
    }

    .proj-badges {
      display: flex;
      gap: 5px;
      align-items: center;
      flex-shrink: 0;
      flex-wrap: wrap;
    }

    .proj-badge {
      font-size: 10px;
      font-family: var(--mono);
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 500;
    }

    .badge-hw {
      background: rgba(245, 166, 35, 0.12);
      color: var(--amber);
      border: 1px solid rgba(245, 166, 35, 0.3);
    }

    .badge-sw {
      background: rgba(0, 212, 255, 0.08);
      color: var(--cyan2);
      border: 1px solid rgba(0, 212, 255, 0.2);
    }

    .badge-free {
      background: rgba(61, 214, 140, 0.1);
      color: var(--green);
      border: 1px solid rgba(61, 214, 140, 0.25);
    }

    .badge-cost {
      background: rgba(245, 166, 35, 0.1);
      color: var(--amber);
      border: 1px solid rgba(245, 166, 35, 0.25);
    }

    .proj-chevron {
      color: var(--text3);
      font-size: 14px;
      transition: transform 0.2s;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .project-card.open .proj-chevron {
      transform: rotate(180deg);
    }

    .project-body {
      display: none;
      padding: 0 20px 20px;
      border-top: 1px solid var(--border);
    }

    .project-card.open .project-body {
      display: block;
    }

    .body-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .body-section {}

    .body-label {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--text3);
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .body-text {
      font-size: 12px;
      color: var(--text2);
      line-height: 1.6;
    }

    .parts-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .part-chip {
      font-size: 11px;
      background: var(--bg3);
      border: 1px solid var(--border2);
      color: var(--text2);
      padding: 3px 9px;
      border-radius: 99px;
    }

    .steps-list {
      list-style: none;
      counter-reset: step;
    }

    .steps-list li {
      counter-increment: step;
      display: flex;
      gap: 10px;
      font-size: 12px;
      color: var(--text2);
      line-height: 1.5;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
    }

    .steps-list li:last-child {
      border-bottom: none;
    }

    .steps-list li::before {
      content: counter(step, decimal-leading-zero);
      font-family: var(--mono);
      font-size: 10px;
      color: var(--cyan2);
      font-weight: 500;
      padding-top: 2px;
      flex-shrink: 0;
    }

    .proj-actions {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      border: none;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--cyan-glow);
      color: var(--cyan);
      border: 1px solid rgba(0, 212, 255, 0.3);
    }

    .btn-primary:hover {
      background: rgba(0, 212, 255, 0.2);
    }

    .btn-secondary {
      background: var(--bg3);
      color: var(--text2);
      border: 1px solid var(--border2);
    }

    .btn-secondary:hover {
      background: var(--bg2);
      color: var(--text);
    }

    /* ─── Phase connections ──────────────────── */
    .connection-note {
      background: rgba(155, 143, 255, 0.07);
      border: 1px solid rgba(155, 143, 255, 0.2);
      border-left: 3px solid var(--purple);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--text2);
      line-height: 1.6;
    }

    .connection-note strong {
      color: var(--purple);
      font-weight: 500;
    }

    .robotics-note {
      background: rgba(0, 212, 255, 0.05);
      border: 1px solid rgba(0, 212, 255, 0.15);
      border-left: 3px solid var(--cyan2);
      border-radius: var(--radius);
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 12px;
      color: var(--text2);
      line-height: 1.6;
    }

    .robotics-note strong {
      color: var(--cyan2);
      font-weight: 500;
    }

    /* ─── Checklist ──────────────────────────── */
    .checklist {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      font-size: 12px;
      color: var(--text2);
      line-height: 1.4;
    }

    .check-box {
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--border2);
      border-radius: 3px;
      flex-shrink: 0;
      margin-top: 1px;
      cursor: pointer;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--green);
    }

    .check-box.checked {
      background: rgba(61, 214, 140, 0.15);
      border-color: var(--green);
    }

    .check-item.checked-item .check-text {
      text-decoration: line-through;
      color: var(--text3);
    }

    /* ─── Resources ──────────────────────────── */
    .resources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px;
    }

    .resource-card {
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }

    .res-type {
      font-family: var(--mono);
      font-size: 9px;
      color: var(--text3);
      letter-spacing: 0.1em;
      margin-bottom: 5px;
    }

    .res-name {
      font-size: 12px;
      color: var(--text);
      font-weight: 500;
      line-height: 1.3;
    }

    .res-note {
      font-size: 11px;
      color: var(--text2);
      margin-top: 2px;
    }

    /* ─── Milestone badge ────────────────────── */
    .milestone-bar {
      background: rgba(61, 214, 140, 0.06);
      border: 1px solid rgba(61, 214, 140, 0.2);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-top: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .ms-icon {
      font-size: 20px;
    }

    .ms-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--green);
      margin-bottom: 2px;
    }

    .ms-desc {
      font-size: 11px;
      color: var(--text2);
      line-height: 1.4;
    }

    /* ─── Mobile ─────────────────────────────── */
    .mobile-nav {
      display: none;
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--bg1);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      overflow-x: auto;
      gap: 6px;
      white-space: nowrap;
    }

    .mobile-nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--bg2);
      color: var(--text2);
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .mobile-nav-btn.active {
      background: var(--cyan-dim);
      border-color: rgba(0, 212, 255, 0.3);
      color: var(--cyan);
    }

    @media (max-width: 800px) {
      .sidebar {
        display: none;
      }

      .mobile-nav {
        display: flex;
      }

      .content-area {
        padding: 20px;
      }

      .main-header {
        padding: 20px;
      }

      .phase-heading {
        font-size: 18px;
      }

      .body-grid {
        grid-template-columns: 1fr;
      }

      .proj-badges {
        display: none;
      }
    }

    /* ─── Scrollbar ──────────────────────────── */
    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg1);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 99px;
    }
  </style>
</head>

<body>

  <div class="shell">

    <!-- ─── SIDEBAR ────────────────────────────────── -->
    <aside class="sidebar">
      <div class="sb-header">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <div class="sb-logo">CTRL.SYS // ROADMAP</div>
          <button id="theme-toggle-btn" onclick="toggleTheme()"
            style="background:none; border:none; color:var(--text2); cursor:pointer; font-size:14px; padding:0; display:flex; align-items:center; justify-content:center;">🌙</button>
        </div>
        <div class="sb-title">Control Systems Mastery</div>
        <div class="sb-sub">7 phases · 21 projects · ~20 months</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-label">
          <span id="prog-label">PHASE PROGRESS</span>
          <span id="prog-pct">0%</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="prog-bar"></div>
        </div>
      </div>

      <nav class="sb-nav">
        <button class="sb-phase-btn active" onclick="switchPhase(0)" id="nav-0">
          <span class="sb-phase-num">P1</span>
          <span class="sb-phase-name">Math Foundations</span>
          <span class="sb-phase-dot"></span>

            title: "Safe & Constrained RL",

          }
        ],
        checks: [
          "Can build a custom Gymnasium environment from scratch",
          "Can train a PPO or SAC agent using stable-baselines3",
          "Understand what entropy regularization does in SAC",
          "Can implement a CBF safety filter as a QP",

          "Can design a fuzzy logic controller with rule tables"
        ],
        resources: [
          { type: "BOOK", name: "Reinforcement Learning — Sutton & Barto", note: "Free at incompleteideas.net — the foundational text" },
          { type: "PAPER", name: "Safe RL using CBFs — Ames et al. (2019)", note: "The key paper on control barrier functions for RL" },
          { type: "TOOL", name: "stable-baselines3 + gymnasium", note: "pip install stable-baselines3 gymnasium" },
          { type: "TOOL", name: "cvxpy", note: "pip install cvxpy — needed for CBF QP solver" }
        ],
        milestone: {
          icon: "🏆",
          title: "Phase 7 milestone — Roadmap complete",
          desc: "You have trained a PPO agent in a custom nonlinear environment you built from scratch. You have bolted a CBF safety filter onto an RL policy and made it physically incapable of violating joint limits. You have built a multi-mode controller that automatically selects the right algorithm for each operating region. You are a control systems engineer."
        },
        projects: [
          {
            num: "19",
            name: "RL agent for a nonlinear water tank",
            tagline: "Build your own physics environment, train PPO, compare against a hand-tuned PID",
            hw: false,
            cost: "Free",
            what: "Create a custom Gymnasium environment: a water tank with Torricelli's nonlinear outflow (dh/dt = -c√h + pump_flow). The agent controls pump duty cycle. Goal: fill to a target level without overflowing, using minimum energy. Implement a careful reward function: penalize level error, penalize pump effort, add a large penalty for overflow. Train PPO for 200,000 steps. Plot the learning curve (episode reward vs steps). Compare trained agent vs hand-tuned PID on three reference levels: easy (50%), medium (75%), hard (90% — near overflow).",
            why: "Building the environment yourself forces you to think about state space, action space, reward design, and terminal conditions — the four decisions that determine whether RL succeeds. Most beginners use pre-built CartPole and miss all of this.",
            parts: ["Laptop only", "Python", "stable-baselines3", "gymnasium", "numpy", "matplotlib"],
            steps: [
              "class WaterTankEnv(gym.Env): obs=[h, h_target, pump], action=[duty_cycle ∈ 0,1]",

              "done = True if h > h_max (overflow) or h < 0 or t > T_max",
              "Train: model = PPO('MlpPolicy', env, verbose=1); model.learn(total_timesteps=200000)",
              "Plot: learning curve (EpRewardMean vs steps); compare agent vs PID on 3 target levels"
            ],
            q1: "Help me build a custom Gymnasium environment for a nonlinear water tank with Torricelli outflow and train a PPO agent using stable-baselines3",
            q2: "How do I design a reward function for water level control RL that prevents overflow without making learning too sparse?"
          },
          {
            num: "20",
            name: "CBF safety filter for any RL policy",
            tagline: "Bolt a safety layer onto any agent — make joint limit violations physically impossible",
            hw: false,
            cost: "Free",

            why: "CBF safety filters are mandatory before any RL policy touches real hardware. This is the most important project in Phase 7 for hardware engineers — it makes learned policies deployable on physical robots.",
            parts: ["Laptop only", "Python", "stable-baselines3", "gymnasium", "cvxpy", "numpy"],
            steps: [
              "JointEnv: obs=[θ, θ̇], action=torque; limits: -1.5 ≤ θ ≤ 1.5 rad",
              "Train PPO without safety; record violations (when |θ| > 1.5)",
              "Barrier function: h(x) = (1.5² - θ²); need ḣ + γh ≥ 0",
              "ḣ = -2θ×θ̇; CBF condition: -2θ×(θ̇ + u×dt) + γ×h ≥ 0 → linear in u",
              "QP via cvxpy: minimize (u-u_rl)², subject to CBF linear constraint; apply u* instead of u_rl"
            ],
            q1: "Help me implement a control barrier function safety filter as a cvxpy QP for a joint-limit-constrained robot arm RL policy",
            q2: "How do I formulate the CBF condition as a linear constraint in u and solve the minimum-intervention QP at each timestep?"
          },
          {
            num: "21",
            name: "Multi-mode adaptive controller",
            tagline: "Three controllers, one arm — let a neural classifier choose who drives",
            hw: false,
            cost: "Free",
            what: "Build a 1-DOF robot arm simulation. Design three controllers: (1) LQR for near-target precision (|error| < 0.1 rad), (2) PID for medium range, (3) trained SAC agent for large moves and disturbances. Collect simulation data labeled by which controller performs best in each operating region (measured by control effort × settling time product). Train a 2-layer classifier in PyTorch to predict the best controller from the current state [θ, θ̇, error]. Simulate the adaptive system: classifier picks controller at each timestep. Compare adaptive vs fixed-PID: the adaptive system should be 30%+ faster on large moves and more precise near the target.",
            why: "Real industrial systems have always switched between control modes. Building the switching logic as a learned classifier (rather than hard-coded if-else rules) generalizes to multiple axes and dynamic conditions — the bridge between all phases of this roadmap.",
            parts: ["Laptop only", "Python", "PyTorch", "stable-baselines3", "scipy", "numpy", "matplotlib"],
            steps: [
              "Simulate 1-DOF arm; implement LQR (Phase 3), PID (Phase 2), train SAC agent",
              "Data collection: for each (θ, θ̇, error) bin, simulate all 3 controllers; label with argmin(cost)",
              "Train PyTorch classifier: 3-input → 2 hidden layers (32 units each) → 3 outputs (softmax)",
              "Adaptive system: at each step, state → classifier → pick controller → apply its action",
              "Compare episode: adaptive vs fixed PID; plot controller switches as colored background segments"
            ],
            q1: "Help me build a multi-mode adaptive controller that uses a neural network classifier to switch between LQR, PID, and SAC based on current state",
            q2: "How do I collect labeled training data for a controller-selection classifier from simulation, and what features should I use as inputs?"
          }
        ]
      }
    ];

    /* ─── State ───────────────────────────────────────── */
    let activePhase = 0;
    const donePhases = new Set();
    const checkedItems = {};

    /* ─── Build functions ─────────────────────────────── */
    function buildPhaseHTML(p, idx) {
      const topicCards = p.topics.map(t => `
    <div class="topic-card">
      <div class="topic-icon">${t.icon}</div>
      <div class="topic-title">${t.title}</div>
      <div class="topic-desc">${t.desc}</div>
      <ul class="topic-items">
        ${t.items.map(i => `<li>${i}</li>`).join('')}
      </ul>
      <div class="topic-tags">
        ${t.tags.map(tag => {
        if (tag === 'math') return '<span class="tag tag-math">math</span>';
        if (tag === 'code') return '<span class="tag tag-code">code</span>';
        if (tag === 'hw') return '<span class="tag tag-hw">hardware</span>';
        if (tag.startsWith('tools:')) return `<span class="tag tag-tools">${tag.slice(6)}</span>`;
        return `<span class="tag">${tag}</span>`;
      }).join('')}
      </div>
    </div>
  `).join('');

      const projectCards = p.projects.map(proj => `
    <div class="project-card" id="proj-${idx}-${proj.num}">
      <div class="project-header" onclick="toggleProject('proj-${idx}-${proj.num}')">
        <div class="proj-num">${proj.num}</div>
        <div class="proj-head-info">
          <div class="proj-name">${proj.name}</div>
          <div class="proj-tagline">${proj.tagline}</div>
        </div>
        <div class="proj-badges">
          ${proj.hw
          ? '<span class="proj-badge badge-hw">Hardware</span>'
          : '<span class="proj-badge badge-sw">Software only</span>'}
          <span class="proj-badge ${proj.cost === 'Free' ? 'badge-free' : 'badge-cost'}">${proj.cost}</span>
        </div>
        <span class="proj-chevron">▾</span>
      </div>
      <div class="project-body">
        <div class="body-grid">
          <div class="body-section">
            <div class="body-label">WHAT YOU BUILD</div>
            <div class="body-text">${proj.what}</div>
          </div>
          <div class="body-section">
            <div class="body-label">WHY THIS TEACHES THE CONCEPT</div>
            <div class="body-text">${proj.why}</div>
          </div>
        </div>

        <div style="margin-top:16px">
          <div class="body-label">PARTS NEEDED</div>
          <div class="parts-wrap" style="margin-top:6px">
            ${proj.parts.map(part => `<span class="part-chip">${part}</span>`).join('')}
          </div>
        </div>

        <div style="margin-top:14px">
          <div class="body-label">BUILD STEPS</div>
          <ol class="steps-list" style="margin-top:8px">
            ${proj.steps.map(s => `<li>${s}</li>`).join('')}
          </ol>
        </div>

        <div class="proj-actions">
          <button class="action-btn btn-primary" onclick="ask('${proj.q1.replace(/'/g, "\\'")}')">
            ▶ Start this project
          </button>
          <button class="action-btn btn-secondary" onclick="ask('${proj.q2.replace(/'/g, "\\'")}')">
            ↗ Deep-dive question
          </button>
        </div>
      </div>
    </div>
  `).join('');

      const checklistKey = `phase-${idx}`;
      if (!checkedItems[checklistKey]) {
        checkedItems[checklistKey] = new Array(p.checks.length).fill(false);
      }

      const checklistHTML = p.checks.map((c, ci) => {
        const checked = checkedItems[checklistKey][ci];
        return `
      <div class="check-item ${checked ? 'checked-item' : ''}" id="ci-${idx}-${ci}">
        <div class="check-box ${checked ? 'checked' : ''}" onclick="toggleCheck(${idx}, ${ci}, this)">
          ${checked ? '✓' : ''}
        </div>
        <span class="check-text">${c}</span>
      </div>
    `;
      }).join('');

      const resourcesHTML = p.resources.map(r => `
    <div class="resource-card">
      <div class="res-type">${r.type}</div>
      <div class="res-name">${r.name}</div>
      <div class="res-note">${r.note}</div>
    </div>
  `).join('');

      const connectionNote = p.connection ? `
    <div class="connection-note">
      <strong>Key connection to other phases:</strong> ${p.connection}
    </div>
  ` : '';

      const robNote = p.robNote ? `
    <div class="robotics-note">
      <strong>Connection to your robotics work:</strong> ${p.robNote}
    </div>
  ` : '';

      return `
    <div class="main-header">
      <div class="phase-eyebrow">${p.code} — ${(idx + 1)} of ${phases.length}</div>
      <div class="phase-heading">${p.title}</div>
      <div class="phase-meta-row">
        <span class="meta-pill pill-duration">⏱ ${p.duration}</span>
        <span class="meta-pill pill-prereq">↳ ${p.prereq}</span>
        ${p.hw !== "None" ? `<span class="meta-pill pill-hw">🔧 ${p.hw}</span>` : ''}
        <span class="meta-pill pill-cost">💲${p.cost}</span>
      </div>
      <div class="phase-desc">${p.desc}</div>
    </div>

    <div class="content-area">

      ${connectionNote}
      ${robNote}

      <div class="section-block">
        <div class="section-label">WHAT TO LEARN</div>
        <div class="topics-grid">${topicCards}</div>
      </div>

      <div class="section-block">
        <div class="section-label">REAL-WORLD PROJECTS</div>
        ${projectCards}
      </div>

      <div class="section-block">
        <div class="section-label">PHASE CHECKLIST — tick when you can do this without help</div>
        <div class="checklist">${checklistHTML}</div>
      </div>

      <div class="section-block">
        <div class="section-label">LEARNING RESOURCES</div>
        <div class="resources-grid">${resourcesHTML}</div>
      </div>

      <div class="milestone-bar">
        <span class="ms-icon">${p.milestone.icon}</span>
        <div>
          <div class="ms-title">${p.milestone.title}</div>
          <div class="ms-desc">${p.milestone.desc}</div>
        </div>
      </div>

    </div>
  `;
    }

    /* ─── Interaction ─────────────────────────────────── */
    function switchPhase(idx) {
      activePhase = idx;

      document.querySelectorAll('.sb-phase-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });

      document.querySelectorAll('.mobile-nav-btn').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });

      const main = document.getElementById('main-content');
      main.innerHTML = buildPhaseHTML(phases[idx], idx);

      updateProgress();
      main.scrollTo(0, 0);
      window.scrollTo(0, 0);
    }

    function toggleProject(id) {
      const card = document.getElementById(id);
      card.classList.toggle('open');
    }

    function saveProgress() {
      localStorage.setItem('controlSystemsProgress', JSON.stringify(checkedItems));
    }

    function loadProgress() {
      const saved = localStorage.getItem('controlSystemsProgress');
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          phases.forEach((p, i) => {
            const key = `phase-${i}`;
            if (parsed[key] && parsed[key].length === p.checks.length) {
              checkedItems[key] = parsed[key];
            }
          });
          // Update donePhases
          phases.forEach((p, i) => {
            const key = `phase-${i}`;
            if (checkedItems[key].every(v => v)) {
              donePhases.add(i);
            }
          });
        } catch (e) {
          console.error('Error loading progress:', e);
        }
      }
    }

    function toggleCheck(phaseIdx, checkIdx, element) {
      const key = `phase-${phaseIdx}`;
      checkedItems[key][checkIdx] = !checkedItems[key][checkIdx];

      saveProgress();

      const allChecked = checkedItems[key].every(v => v);
      const navBtn = document.getElementById(`nav-${phaseIdx}`);
      if (allChecked) {
        donePhases.add(phaseIdx);
        if (navBtn) navBtn.classList.add('done');
      } else {
        donePhases.delete(phaseIdx);
        if (navBtn) navBtn.classList.remove('done');
      }

      // Update DOM locally instead of rebuilding the entire phase HTML
      if (element) {
        const isChecked = checkedItems[key][checkIdx];
        element.classList.toggle('checked', isChecked);
        element.innerHTML = isChecked ? '✓' : '';
        const checkItem = element.closest('.check-item');
        if (checkItem) {
          checkItem.classList.toggle('checked-item', isChecked);
        }
      }

      updateProgress();
    }

    function updateProgress() {
      let total = 0, checked = 0;
      phases.forEach((p, idx) => {
        const key = `phase-${idx}`;
        if (checkedItems[key]) {
          total += p.checks.length;
          checked += checkedItems[key].filter(v => v).length;
        } else {
          total += p.checks.length;
        }
      });
      const pct = total > 0 ? Math.round((checked / total) * 100) : 0;
      document.getElementById('prog-bar').style.width = pct + '%';
      document.getElementById('prog-pct').textContent = pct + '%';
    }

    function toggleTheme() {
      const root = document.documentElement;
      const currentTheme = root.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', newTheme);

      const icon = newTheme === 'light' ? '☀️' : '🌙';
      const btn = document.getElementById('theme-toggle-btn');
      const btnMobile = document.getElementById('theme-toggle-mobile');
      if (btn) btn.textContent = icon;
      if (btnMobile) btnMobile.textContent = icon;

      localStorage.setItem('controlSystemsTheme', newTheme);
    }

    function initTheme() {
      const savedTheme = localStorage.getItem('controlSystemsTheme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      const icon = savedTheme === 'light' ? '☀️' : '🌙';
      const btn = document.getElementById('theme-toggle-btn');
      const btnMobile = document.getElementById('theme-toggle-mobile');
      if (btn) btn.textContent = icon;
      if (btnMobile) btnMobile.textContent = icon;
    }

    function ask(q) {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'ask', text: q }, '*');
      }
    }

    /* ─── Init ────────────────────────────────────────── */
    initTheme();
    phases.forEach((p, i) => { checkedItems[`phase-${i}`] = new Array(p.checks.length).fill(false); });
    loadProgress();
    switchPhase(0);
    updateProgress();
  </script>
</body>
